; Unofficial-KR-Sfall legacy Korean GDI font configuration
; Place this file beside ddraw.dll in the Fallout 2 game directory.

[TEXT]
; Font 101: dialogue, logs, character editor, and small UI text.
Name=Dotum
Size=11
LineHeight=11
Adjust=1
YOffset=0
Weight=400

[BUTTON]
; Fonts 102 and 103: normal and large buttons.
Name=NanumBarunGothic
File=fonts\NanumBarunGothic.ttf
Size=15
LineHeight=17
Adjust=0
YOffset=0
Weight=400

[GNW]
; Font 104: main titles and the largest menu text.
Name=NanumBarunGothic
Size=18
LineHeight=20
Adjust=0
YOffset=0
Weight=400

[MISC]
; 0 = disabled, 1 = enabled.
Enable=1
; Convert the GDI raster to crisp Fallout palette pixels.
BinaryThreshold=128
